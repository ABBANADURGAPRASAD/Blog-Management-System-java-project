<section class="feel-card feel-card-strangers-game">
  <div class="sg-card-hero-wrap">
    <img
      class="sg-card-hero"
      src="assets/images/strangers-game-hero.png"
      alt="Cartoon crowd — let's play with strangers"
      width="600"
      height="320"
      loading="lazy"
    />
  </div>

  <p class="hint" *ngIf="!gameActive">
    Create your own Snap-style avatar once, then jump into a playful stranger lobby.
  </p>

  <div class="sg-saved-profile" *ngIf="character && !gameActive">
    <app-strangers-game-avatar
      [skinColor]="character.skinColor"
      [shape]="character.shape"
      [outfitId]="character.outfitId"
      size="sm"
    ></app-strangers-game-avatar>
    <div class="sg-saved-meta">
      <strong>{{ character.name }}</strong>
      <span>{{ outfitLabel }} · saved on this device</span>
    </div>
    <button type="button" class="sg-link-btn" (click)="onEditCharacter()">Edit</button>
  </div>

  <button
    type="button"
    class="btn-strangers-play"
    (click)="onLetsPlay()"
    [disabled]="!userId"
    *ngIf="!gameActive"
  >
    Let's Play
  </button>

  <div class="sg-game-active" *ngIf="gameActive && character">
    <div class="sg-game-header">
      <app-strangers-game-avatar
        [skinColor]="character.skinColor"
        [shape]="character.shape"
        [outfitId]="character.outfitId"
        size="md"
      ></app-strangers-game-avatar>
      <div>
        <p class="sg-game-playing-as">Playing as</p>
        <strong class="sg-game-name">{{ character.name }}</strong>
      </div>
    </div>

    <div class="sg-lobby-stage" aria-live="polite">
      <div class="sg-lobby-orbit">
        <span class="sg-lobby-peer sg-peer-1" aria-hidden="true">?</span>
        <span class="sg-lobby-peer sg-peer-2" aria-hidden="true">?</span>
        <span class="sg-lobby-peer sg-peer-3" aria-hidden="true">?</span>
        <app-strangers-game-avatar
          class="sg-lobby-you"
          [skinColor]="character.skinColor"
          [shape]="character.shape"
          [outfitId]="character.outfitId"
          size="md"
        ></app-strangers-game-avatar>
      </div>
      <p class="sg-game-status">{{ gameStatus }}</p>
    </div>

    <div class="sg-game-actions">
      <button type="button" class="secondary sg-inline-btn" (click)="onEditCharacter()">
        Edit character
      </button>
      <button type="button" class="ghost sg-inline-btn" (click)="exitGame()">Leave lobby</button>
    </div>
  </div>

  <p class="status" *ngIf="gameStatus && !gameActive">{{ gameStatus }}</p>
</section>

<app-strangers-game-character-dialog
  [open]="characterDialogOpen"
  [accountGender]="accountGender"
  [existing]="character"
  [editMode]="editCharacterMode"
  (closed)="onDialogClosed()"
  (created)="onCharacterCreated($event)"
></app-strangers-game-character-dialog>
