<header class="app-header" *ngIf="!isHeaderHidden">
  <div class="header-left">
    <a (click)="onHomeClick()" class="tumblr-logo" style="cursor: pointer;">
      <img src="assets/images/social-media.png" alt="DP Blog Logo" class="logo-image" />
      <span class="logo-text">Feel free</span>
    </a>
    <div class="search-bar search-wrapper" *ngIf="showSearch">
      <input
        type="text"
        class="search-input"
        placeholder="Search users..."
        [(ngModel)]="searchText"
        (input)="searchUsers()"
        (focus)="onSearchFocus()"
        (blur)="onSearchBlur()"
      />
      <span class="search-icon">𓍯𓂃𓏧♡</span>
      <div class="search-dropdown" *ngIf="showSearchDropdown">
        <div class="search-dropdown-list">
          <a *ngFor="let u of usersList" class="search-dropdown-item" (click)="selectUser(u); $event.preventDefault()" href="">
            <img [src]="u.profileImageUrl || u.profilePic || 'assets/images/dp_profile.jpeg'" [alt]="u.username" class="search-dropdown-pic" onerror="this.src='assets/images/dp_profile.jpeg'" />
            <div class="search-dropdown-info">
              <span class="search-dropdown-name">{{ u.fullName || u.username || 'User' }}</span>
              <span class="search-dropdown-username">{{ u.username }}</span>
            </div>
          </a>
          <p class="search-dropdown-empty" *ngIf="usersList.length === 0">No users found.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="header-right">
    <ng-container *ngIf="isAuthenticated">
      <!-- Messages -->
      <button
        type="button"
        class="header-icon-btn"
        [class.header-icon-btn--active]="chatOpen"
        (click)="toggleChat()"
        title="Messages"
        aria-label="Open messages"
        [attr.aria-expanded]="chatOpen"
      >
        <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          />
        </svg>
        <span class="header-icon-badge" *ngIf="chatUnreadCount > 0">{{
          chatUnreadCount > 99 ? '99+' : chatUnreadCount
        }}</span>
      </button>

      <!-- Finder -->
      <a
        routerLink="/random-chat"
        class="header-icon-btn"
        title="Finder"
        aria-label="Open Finder"
      >
        <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" />
          <polygon
            points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
          />
        </svg>
      </a>

      <!-- New Post -->
      <button
        type="button"
        class="header-icon-btn"
        (click)="onNewPostClick()"
        title="New Post"
        aria-label="Create new post"
      >
        <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 5v14M5 12h14"
          />
        </svg>
      </button>

      <!-- Notifications -->
      <div class="notification-wrap" #notificationWrap>
        <button
          type="button"
          class="header-icon-btn"
          [class.header-icon-btn--active]="notificationsOpen"
          (click)="toggleNotifications($event)"
          title="Notifications"
          aria-label="Notifications"
          [attr.aria-expanded]="notificationsOpen"
        >
          <svg class="header-nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M13.73 21a2 2 0 0 1-3.46 0"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="header-icon-badge" *ngIf="notificationUnreadCount > 0">{{
            notificationUnreadCount > 99 ? '99+' : notificationUnreadCount
          }}</span>
        </button>
        <div class="notification-dropdown" *ngIf="notificationsOpen" (click)="$event.stopPropagation()">
          <div class="notification-dropdown-header">
            <span>Notifications</span>
            <button
              type="button"
              class="notification-mark-all"
              *ngIf="notificationUnreadCount > 0"
              (click)="markAllNotificationsRead()"
            >
              Mark all read
            </button>
          </div>
          <div class="notification-dropdown-body">
            <p class="notification-loading" *ngIf="notificationsLoading">Loading…</p>
            <p class="notification-empty" *ngIf="!notificationsLoading && notifications.length === 0">
              No notifications yet.
            </p>
            <button
              type="button"
              class="notification-item"
              *ngFor="let n of notifications"
              [class.unread]="!n.read"
              (click)="onNotificationRowClick(n, $event)"
            >
              <img
                class="notification-avatar"
                [src]="n.actorProfileImageUrl || 'assets/images/dp_profile.jpeg'"
                alt=""
                onerror="this.src='assets/images/dp_profile.jpeg'"
              />
              <div class="notification-text">
                <span>{{ notificationSummary(n) }}</span>
                <time *ngIf="n.createdAt">{{ n.createdAt | date : 'short' }}</time>
              </div>
            </button>
          </div>
        </div>
      </div>

      <!-- Profile menu: Profile / Settings / Logout -->
      <div class="profile-menu-wrap" #profileMenuWrap>
        <button
          type="button"
          class="header-profile-btn"
          [class.header-icon-btn--active]="profileMenuOpen"
          (click)="toggleProfileMenu($event)"
          title="Account"
          aria-label="Account menu"
          [attr.aria-expanded]="profileMenuOpen"
        >
          <img
            [src]="headerProfileSrc()"
            alt=""
            class="header-profile-avatar"
            onerror="this.src='assets/images/dp_profile.jpeg'"
          />
          <svg class="header-profile-caret" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6 9l6 6 6-6"
            />
          </svg>
        </button>

        <div
          class="profile-dropdown"
          *ngIf="profileMenuOpen"
          (click)="$event.stopPropagation()"
          role="menu"
        >
          <button type="button" class="profile-dropdown-item" role="menuitem" (click)="onProfileMenuProfile()">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              />
              <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="2" />
            </svg>
            Profile
          </button>
          <button type="button" class="profile-dropdown-item" role="menuitem" (click)="onProfileMenuSettings()">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            Settings
          </button>
          <div class="profile-dropdown-divider"></div>
          <button
            type="button"
            class="profile-dropdown-item profile-dropdown-item--danger"
            role="menuitem"
            (click)="onProfileMenuLogout()"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"
              />
              <polyline
                points="16 17 21 12 16 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                x1="21"
                y1="12"
                x2="9"
                y2="12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            Logout
          </button>
        </div>
      </div>
    </ng-container>
  </div>
</header>
<app-chat-panel
  *ngIf="isAuthenticated"
  [open]="chatOpen"
  (openChange)="onChatOpenChange($event)"
  (unreadCountChange)="chatUnreadCount = $event"
></app-chat-panel>
